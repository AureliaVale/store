<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelia Vale | Digital Store & Resources</title>
    <!-- Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Hero Section -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-12 text-center">
            <span class="inline-block bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-3">AV Edu Resources & Collections</span>
            <h1 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">Aurelia Vale Digital Store</h1>
            <p class="mt-4 text-lg text-slate-600 max-w-2xl mx-auto">Explore curated AI prompt packs, practical toolkits, and insightful guides designed to empower educators, parents, and readers.</p>
        </div>
    </header>

    <!-- Main Store Content -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
        
        <!-- Filter Controls -->
        <div id="filter-container" class="flex flex-wrap justify-center gap-2 mb-10">
            <button onclick="filterProducts('All')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-900 text-white transition-all shadow-sm">All Products</button>
            <!-- Dynamic category buttons will be inserted here -->
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Products will be loaded dynamically here from products.json -->
            <div class="col-span-full text-center py-12 text-slate-400">Loading catalog...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-16">
        <div class="max-w-6xl mx-auto px-6 py-8 text-center text-sm text-slate-500">
            <p>&copy; <span id="current-year"></span> Aurelia Vale. All rights reserved.</p>
            <p class="mt-1">Powered by GitHub Pages & Lemon Squeezy.</p>
        </div>
    </footer>

    <!-- JavaScript to load products and handle filtering -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        let allProducts = [];

        async function loadStore() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error('Could not load products.json');
                allProducts = await response.json();
                
                renderCategories(allProducts);
                renderProducts(allProducts);
            } catch (error) {
                console.error(error);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-xl border border-rose-100 p-6">
                        <p class="font-semibold">Unable to load product catalog.</p>
                        <p class="text-sm mt-1">Please ensure your <code>products.json</code> file is correctly uploaded in your repository root.</p>
                    </div>
                `;
            }
        }

        function renderCategories(products) {
            const categories = ['All', ...new Set(products.map(p => p.category))];
            const filterContainer = document.getElementById('filter-container');
            
            // Keep 'All' button, generate the rest
            filterContainer.innerHTML = `<button onclick="filterProducts('All')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-900 text-white transition-all shadow-sm" data-category="All">All Products</button>`;
            
            categories.filter(c => c !== 'All').forEach(cat => {
                filterContainer.innerHTML += `<button onclick="filterProducts('${cat}')" class="filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition-all" data-category="${cat}">${cat}</button>`;
            });
        }

        function filterProducts(category) {
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.getAttribute('data-category') === category || (category === 'All' && btn.innerText === 'All Products')) {
                    btn.className = "filter-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-900 text-white transition-all shadow-sm";
                } else {
                    btn.className = "filter-btn px-4 py-2 text-sm font-medium rounded-full bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition-all";
                }
            });

            const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            
            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No products found in this category.</div>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between overflow-hidden p-6">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md uppercase tracking-wide">${p.category}</span>
                            ${p.badge ? `<span class="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full">${p.badge}</span>` : ''}
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 leading-snug mb-2">${p.title}</h3>
                        <p class="text-sm text-slate-600 leading-relaxed mb-6">${p.description}</p>
                    </div>
                    
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                        ${p.sample_url ? `<a href="${p.sample_url}" target="_blank" class="text-xs font-medium text-slate-600 hover:text-slate-900 underline underline-offset-4">Free Sample</a>` : '<span></span>'}
                        
                        <a href="${p.checkout_url}" target="_blank" class="inline-flex items-center justify-center bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors shadow-sm">
                            Get Access
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize store load
        loadStore();
    </script>

    
</script>
</body>
</html>
