name: Quiet Store Auto-Promoter & Feed Builder

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  build-store-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Pinterest XML Catalog
        run: python .github/scripts/generate_feed.py

      - name: Create promos directory & run promo generator
        run: |
          mkdir -p promos
          python .github/scripts/generate_promo.py || echo "Promo script skipped"

      - name: Commit and push generated feed and promos
        run: |
          git config --global user.name "Quiet Store Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add catalog.xml promos/
          git commit -m "Auto-update Pinterest catalog and weekly promo [skip ci]" || echo "No changes to commit"
          git push
