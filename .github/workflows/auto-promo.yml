name: Quiet Store Auto-Promoter

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows you to run it manually anytime you want!

permissions:
  contents: write

jobs:
  generate-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run promotion generator script
        run: python .github/scripts/generate_promo.py

      - name: Commit and push generated promo
        run: |
          git config --global user.name "Quiet Store Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add promos/
          git commit -m "Auto-generate weekly product promo [skip ci]" || echo "No changes to commit"
          git push
